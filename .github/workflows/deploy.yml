##
## Build the image on GitHub, then tell the Azure VM to run it.
##
## The VM never builds anything: it pulls a tag pinned to this commit, so what
## runs in production is exactly what was built here, and a rollback is a re-run
## of an older green deploy. `next build` typechecks, so a type error fails the
## build before anything is pushed.
##
## Requires three repository secrets — deploy/provision.sh prints them:
##   AZURE_VM_HOST     the *.cloudapp.azure.com name
##   AZURE_VM_USER     azureuser
##   AZURE_VM_SSH_KEY  the private half of deploy_key
##
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one half-done: the app container is
# stopped and replaced, so two overlapping runs would fight over SQLite.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ secrets.AZURE_VM_HOST }}
      VM_USER: ${{ secrets.AZURE_VM_USER }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The compose file and the Caddyfile live in this repo, so a change to
      # either ships with the commit that made it rather than by hand.
      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile \
            "$VM_USER@$VM_HOST:/srv/soccer/"

      # Through stdin, so the token never appears in the VM's process list.
      # It dies with this workflow run — no registry password lives on the box.
      - name: Sign the VM in to the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/soccer

          # .env holds SESSION_SECRET and SITE_ADDRESS and is never overwritten;
          # only the image tag moves.
          if grep -q '^APP_IMAGE=' .env; then
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env
          else
            echo "APP_IMAGE=$IMAGE" >> .env
          fi

          docker compose pull
          docker compose up -d --remove-orphans

          echo "Waiting for the app to answer..."
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "healthy after ${i} attempt(s)"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "The new container never became healthy. Recent logs:" >&2
          docker compose logs --tail 60 app >&2
          exit 1
          REMOTE

      - name: Sign the VM back out
        if: always()
        run: ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'docker logout ghcr.io' || true

      - name: Check the public address
        run: |
          # On a first deploy Caddy is still completing the ACME challenge when
          # this runs, and it fetches a fresh certificate after any restart that
          # lost its volume. Retry rather than failing a deploy that worked.
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 -o /dev/null "https://$VM_HOST/api/health"; then
              echo "answering after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "https://$VM_HOST/api/health never answered" >&2
          exit 1
